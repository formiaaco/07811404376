<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معلومات التواصل في حالات الطوارئ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Noto Sans Arabic", Tahoma, Arial, sans-serif;
  background: linear-gradient(145deg, #f7f3ec, #e9e2d5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  color: #272522;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 28px;
  padding: 30px 22px 24px;
  box-shadow: 0 16px 45px rgba(0,0,0,.12);
  text-align: center;
}

.icon {
  width: 76px;
  height: 76px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f2eadb;
  font-size: 38px;
}

h1 {
  font-size: 25px;
  margin: 0 0 10px;
  font-weight: 800;
}

.intro {
  font-size: 16px;
  line-height: 1.8;
  color: #666;
  margin: 0 auto 25px;
  max-width: 350px;
}

.contact {
  border: 1px solid #eee5d8;
  border-radius: 20px;
  padding: 18px 16px;
  margin-top: 13px;
  text-align: right;
  background: #fffdfa;
}

.label {
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 12px;
}

.call {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  background: #242424;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: 700;
}

.note {
  font-size: 13px;
  color: #888;
  line-height: 1.7;
  margin: 22px 8px 0;
}

.nfc {
  font-size: 12px;
  color: #aaa;
  margin-top: 18px;
}
</style>
</head>

<body>

<main class="card">

  <div class="icon">🛡️</div>

  <h1>معلومات التواصل في حالات الطوارئ</h1>

  <p class="intro">
    هذه الميدالية مخصصة للمساعدة في التواصل مع اهل الطفل عند الحاجة.
  </p>

  <section class="contact">

    <div class="label">👨 ولي الأمر</div>

    <a class="call" href="tel:+9647741814139">
      📞 الاتصال بولي الأمر
    </a>

  </section>

  <p class="note">
    يرجى استخدام معلومات التواصل هذه عند العثور على الطفل
    أو في حال حدوث امر طارئ يستدعي التواصل مع أهله.
  </p>

  <div class="nfc">
    NFC • صفحة التواصل
  </div>

</main>

</body>
</html>
